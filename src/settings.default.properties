
# possible values: OFF,FATAL,ERROR,WARN,INFO,DEBUG,TRACE,ALL
logLevel=ALL
reloadOnChange=true

# send plugin welcome message to player on login
enableWelcomeMessage=false

# show players in the area-permission list if they have been online within the last N hours
# set to 0 or lower to disable this additional list source
recentlyOnlinePermissionListHours=24

# admin only settings
adminIgnoreLimit=true
adminIgnoreTime=true
# lets admins see hidden special-zone frames when showing other areas
allowAdminOverride=false

# controls special-zone frames shown through "Show Other Areas"
showSpecialAreaFrames=true
showStaticAreaFrames=true
showPvPAreaFrames=true
showRestAreaFrames=true
showTrapAreaFrames=true
# renew zones are hidden by default
showRenewAreaFrames=false

# automatically remove claims from owners inactive longer than the configured days
# auto-removal frees claims and areas but does not reset chunks
enableAutoClaimRemoval=false
autoClaimRemovalInactiveDays=90
autoClaimRemovalDelaySeconds=60

# default interval in hours for newly created renew zones
renewZoneDefaultIntervalHours=24
# who receives renew-zone reset announcements: none, all, admins
renewZoneResetAnnouncementTarget=none
# renew zones are reset one at a time; wait at least this many seconds before the next due zone
renewZoneResetBaseDelaySeconds=2
# add this many milliseconds for every reset chunk column, capped by renewZoneResetMaxDelaySeconds
renewZoneResetDelayPerChunkMillis=25
renewZoneResetMaxDelaySeconds=60

# minimum time in minutes to stay in a chunk before claim is allowed
minutesToClaim=10

# scale factor for claiming more and more chunks 
# 1.0 = always baseTime, (time to claim a chunk will never change)
# >1  = more chunks = more time to claim (first will be faster than all after that)
# <1  = more chunks = less time to claim (first will take more time than all after that)
# default 1.01 : 1. claim 600s, second 606s, third 616s, ... 100 ~ 1607s
# example 1.05 : 1. claim 600s, second 630s, third 661s, ... 100 ~75143s (~1252h or 52 days of playtime!)
# example 0.95 : 1. claim 600s, second 570s, third 541s, ... 100 ~    4s
claimTimeScaleFactor=1.01

# basic claim limit (how many claims you can have)
# you can set this high or low, or even 0 and adjust the playTimeHoursExtraClaimFactor to determine limit
basicClaimLimit=1

# factor for additional maximum claims, default 0.6 = 100 Minutes/extraclaim (100 Minutes = 1.66..7h*0.6=1)
playTimeHoursExtraClaimFactor=0.6

# if true players can sell and buy claims through Wallet
allowClaimSale=false
# if true buying a claim can exceed players claim limit (WARN: could be exploited)
allowClaimBuyExceedLimit=false

# allow bridge/native route layers to expose active claim-sale listings
exposeClaimSales=true
# allow bridge/native route layers to expose renew-zone metadata
exposeRenewZones=true

# if true LandClaim registers an extra-claim capacity offer in OZ Shop when Shop is available
enableExtraClaimShopOffer=true
# first extra-claim purchase price
extraClaimBasePrice=200
# linear percent increase per already purchased extra-claim capacity
extraClaimPriceIncreasePercent=10
# empty means Wallet default currency
extraClaimShopCurrencyIdentifier=

# [NOT YET IMPLEMENTED] 
# minimum offline time until other players can claim (takeover) the chunk in days
# claimProtectionBaseTimeDays=7
# takeovertime is the time a player needs to takeover a claim owned by someone else that has NO protection
# you can turn off this feature by setting this to 0, that means a takeover needs no time at all (only normal claim time)
# For a pvp scenario you could rise this value to >1 which means the aggressor need to stay more time in a chunk than the defender,
# claimProtectionTakeoverTimeScale=0.5

# [NOT YET IMPLEMENTED]
# claim protection can be exceeded by playtime, this is a factor, 1 means 1 day playtime = 1 day protection
# you need to exceed the baseTimeDays to get additional protection, so 1 might be not the best value to choose
# by default 1 day counts as 5
# claimProtectionExtraTimeScale=5


